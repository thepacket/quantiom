name: Draft PDF

# Compiles the JOSS paper (paper/paper.md + paper.bib) to a PDF on every
# change, using the Open Journals draft action, and uploads it as a build
# artifact so the typeset paper can be reviewed without a local LaTeX stack.

on:
  push:
    paths:
      - paper/**
      - .github/workflows/draft-pdf.yml
  workflow_dispatch:

jobs:
  paper:
    runs-on: ubuntu-latest
    name: Paper Draft
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper/paper.md

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper/paper.pdf
