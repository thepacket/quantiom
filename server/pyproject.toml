[project]
name = "quantiom-server"
version = "0.0.0"
description = "Quantiom server — bridges multi-language quantum-computing packages."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sympy>=1.13",
  "numpy>=2.1",
  "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quantiom"]

[tool.ruff]
line-length = 100
target-version = "py311"
