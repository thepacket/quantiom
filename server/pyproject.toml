[project]
name = "quantiom-server"
version = "0.9.0"
description = "Quantiom server — static hosting for the client-side quantum simulator."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quantiom"]
